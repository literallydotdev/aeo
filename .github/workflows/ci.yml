name: CI

# Every step here is free: the test suite fakes every model, provider and
# agent CLI, and *.live.spec.ts (real model calls) never runs in CI.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The test suite on both supported platforms. macOS is where child
  # processes, the Codex sandbox, file syncing and temp paths differ from
  # Linux, and the tests exercise all of them with fakes.
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  # The packed tarball installed into an empty project: the offline commands
  # and a library import work with no checkout, credentials or network.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pack and smoke test
        run: |
          set -eu
          pnpm pack --pack-destination "$RUNNER_TEMP"
          tarball="$(ls "$RUNNER_TEMP"/literally-aeo-*.tgz)"
          cd "$(mktemp -d)"
          npm init -y > /dev/null
          npm install "$tarball"
          npx literally-aeo init
          npx literally-aeo plan --config audit.json --output ./audit-run
          node --input-type=module -e "await import('literally-aeo/bundle/verify'); await import('literally-aeo/contracts');"
