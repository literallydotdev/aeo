name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  package:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The packed tarball installed into an empty project: the offline
      # commands and a library import work with no checkout, credentials or
      # network.
      - name: Pack and smoke test
        run: |
          set -eu
          pnpm pack --pack-destination "$RUNNER_TEMP"
          tarball="$(ls "$RUNNER_TEMP"/literally-aeo-*.tgz)"
          cd "$(mktemp -d)"
          npm init -y > /dev/null
          npm install "$tarball"
          npx literally-aeo init
          npx literally-aeo plan --config audit.json --output ./audit-run
          node --input-type=module -e "await import('literally-aeo/bundle/verify'); await import('literally-aeo/contracts');"
